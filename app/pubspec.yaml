name: mandu_reader
description: "漫读 · 漫画小说资源管理：无服务端，S3 兼容桶直连的漫画/小说阅读器。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理（已决策：Riverpod，无 codegen）
  flutter_riverpod: ^3.4.3

  # 路由
  go_router: ^18.0.1

  # 本地库（drift + 官方跨平台初始化；底层自带 sqlite3 原生库打包）
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  # S3 兼容客户端（SigV4 内部实现，外层 BucketClient 封装）
  minio: ^3.5.8

  # 凭证加密存储 + 加解密
  flutter_secure_storage: ^11.2.0
  encrypt: ^5.0.3
  crypto: ^3.0.7

  # 书源引擎预留 + 基础
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  logging: ^1.3.0
  flutter_avif: ^3.1.0
  epubx: ^4.0.0
  image: ^3.3.0
  local_auth: ^3.0.2

  # 纯 Dart 核心（桶契约/索引合并/AVIF 策略/重试），实现见 ../pkgs/mandu_core
  mandu_core:
    path: ../pkgs/mandu_core
  html: ^0.15.7
  gbk_codec: ^0.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # drift 代码生成
  drift_dev: ^2.35.0
  build_runner: ^2.4.13
  archive: ^3.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/rules/

# sqlite3 的 build hook 默认从 GitHub Releases 下载预编译库，本网络访问不通。
# 经 gh-proxy 代理下载；代理失效时换一个可用代理或恢复官方地址即可。
hooks:
  user_defines:
    sqlite3:
      source: sqlite3
      url_pattern: "https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
